name: P2P Escrow Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run pytest (Linux / GenVM direct mode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      - name: Pre-cache GenVM binary
        # genlayer-test looks for ~/.cache/gltest-direct/genvm-universal-<ver>.tar.xz
        # but the release only ships genvm-linux-amd64.tar.xz (no universal build).
        # We download the linux-amd64 tarball and place it under the expected name
        # so the SDK loader finds it in cache and skips the failing download.
        run: |
          GENVM_VERSION=$(python - <<'EOF'
          import urllib.request, json
          resp = urllib.request.urlopen(
              "https://api.github.com/repos/genlayerlabs/genvm/releases/latest",
              timeout=30,
          )
          print(json.load(resp)["tag_name"])
          EOF
          )
          echo "GenVM version: $GENVM_VERSION"

          CACHE_DIR="$HOME/.cache/gltest-direct"
          mkdir -p "$CACHE_DIR"

          TARBALL="$CACHE_DIR/genvm-universal-${GENVM_VERSION}.tar.xz"
          URL="https://github.com/genlayerlabs/genvm/releases/download/${GENVM_VERSION}/genvm-linux-amd64.tar.xz"
          echo "Downloading $URL -> $TARBALL"
          curl -fsSL -o "$TARBALL" "$URL"
          echo "Done — $(du -sh $TARBALL)"

      - name: Run tests
        run: python -m pytest tests/test_p2p_escrow.py -v --tb=short
