name: P2P Escrow Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run pytest (Linux / GenVM direct mode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      - name: Pre-cache GenVM binary
        # genlayer-test expects ~/.cache/gltest-direct/genvm-universal-<ver>.tar.xz
        # containing runners/py-genlayer/*.tar entries.
        # The release ships genvm-runners-all.tar.xz which has exactly that structure,
        # so we download it and place it under the expected filename.
        run: |
          GENVM_VERSION=$(python - <<'EOF'
          import urllib.request, json
          resp = urllib.request.urlopen(
              "https://api.github.com/repos/genlayerlabs/genvm/releases/latest",
              timeout=30,
          )
          print(json.load(resp)["tag_name"])
          EOF
          )
          echo "GenVM version: $GENVM_VERSION"

          CACHE_DIR="$HOME/.cache/gltest-direct"
          mkdir -p "$CACHE_DIR"

          TARBALL="$CACHE_DIR/genvm-universal-${GENVM_VERSION}.tar.xz"
          URL="https://github.com/genlayerlabs/genvm/releases/download/${GENVM_VERSION}/genvm-runners-all.tar.xz"
          echo "Downloading $URL"
          curl -fsSL -o "$TARBALL" "$URL"
          echo "Cached: $(du -sh $TARBALL)"

          # Verify the expected structure is present
          python - <<'PYEOF'
          import tarfile, sys, pathlib, os
          p = pathlib.Path(os.path.expanduser("~/.cache/gltest-direct"))
          tarballs = list(p.glob("genvm-universal-*.tar.xz"))
          assert tarballs, "No tarball found"
          with tarfile.open(tarballs[0], "r:xz") as tf:
              runners = [m.name for m in tf.getmembers()
                         if m.name.startswith("runners/py-genlayer/") and m.name.endswith(".tar")]
          print(f"Found {len(runners)} py-genlayer runner(s) in tarball ✓")
          assert runners, "No py-genlayer runners found!"
          PYEOF

      - name: Run tests
        run: python -m pytest tests/test_p2p_escrow.py -v --tb=short
